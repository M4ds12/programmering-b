<a class="movie-card" href="{{movie_url}}">
    <div class="movie-poster">
        <img class="movie-thumb" src="{{thumb}}">
        <div class="play-overlay">
            <button class="play-button"></button>
        </div>
    </div>
    <div class="movie-info">
        <div class="movie-title">{{title}}</div>
        <div class="movie-meta">
            <span class="movie-year">{{runtime}}</span>
            <span class="movie-rating">{{imdb}}</span>
        </div>
        <!-- <span class="movie-genre">Sci-Fi Drama</span> -->
    </div>
</a>
