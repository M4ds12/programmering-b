<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEHOME - Search Movies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0d2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.7) 70%, transparent 100%);
            padding: 1rem 4%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            backdrop-filter: blur(20px);
            transition: all 0.4s ease;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
        }

        .header.scrolled {
            background: rgba(10, 10, 15, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1920px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: -1px;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: #e5e7eb;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #8b5cf6;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #8b5cf6, #06b6d4);
            border-radius: 1px;
        }

        /* Main Content */
        .main-content {
            max-width: 1920px;
            margin: 0 auto;
            padding: 100px 4% 0;
        }

        .search-section {
            text-align: center;
            margin-bottom: 4rem;
            padding: 3rem 0;
        }

        .search-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, #8b5cf6 50%, #06b6d4 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            letter-spacing: -2px;
        }

        .search-subtitle {
            font-size: 1.3rem;
            color: #9ca3af;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 1.2rem 1.8rem;
            font-size: 1.1rem;
            background: rgba(15, 15, 25, 0.8);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            color: #ffffff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1), 0 8px 32px rgba(139, 92, 246, 0.2);
            background: rgba(15, 15, 25, 0.95);
        }

        .search-input::placeholder {
            color: #6b7280;
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .search-btn:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }

        /* Movie Grid */
        .movies-section {
            margin-top: 2rem;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #f9fafb;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #8b5cf6, #06b6d4);
            border-radius: 2px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .movie-card {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.4) 0%, rgba(15, 15, 25, 0.6) 100%);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            border: 1px solid rgba(139, 92, 246, 0.1);
            backdrop-filter: blur(10px);
        }

        .movie-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .movie-poster {
            width: 100%;
            height: 380px;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b5cf6;
            font-size: 3.5rem;
            position: relative;
            overflow: hidden;
        }

        .movie-poster::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(6, 182, 212, 0.1));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .movie-card:hover .movie-poster::before {
            opacity: 1;
        }

        .movie-info {
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(15, 15, 25, 0.9) 0%, rgba(30, 27, 75, 0.7) 100%);
        }

        .movie-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: #f9fafb;
            line-height: 1.3;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .movie-year {
            color: #9ca3af;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .movie-rating {
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .movie-genre {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #a5b4fc;
            display: inline-block;
            font-weight: 500;
        }

        /* Play Button Overlay */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(6, 182, 212, 0.15));
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .movie-card:hover .play-overlay {
            opacity: 1;
        }

        .play-button {
            background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
            border: none;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .play-button:hover {
            background: #ffffff;
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
        }

        .play-button::before {
            content: '▶';
            color: #1f2937;
            font-size: 1.4rem;
            margin-left: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .search-title {
                font-size: 2.5rem;
            }

            .main-content {
                padding: 140px 4% 0;
            }

            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 1rem;
            }

            .movie-poster {
                height: 320px;
                font-size: 3rem;
            }

            .nav-links {
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <nav class="nav">
            <a href="/" class="logo">CINEHOME</a>
            <ul class="nav-links">
                <li><a href="#" class="active">Discover</a></li>
                <li><a href="#" onclick="showMoviePanel()">Movies</a></li>
                <li><a href="#">Series</a></li>
                <li><a href="#">Watchlist</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <section class="search-section">
            <h1 class="search-title">Discover Extraordinary Stories</h1>
            <p class="search-subtitle">Explore a curated collection of premium entertainment</p>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Search movies, series, documentaries..." id="searchInput">
                <button class="search-btn" onclick="searchMovies()">Search</button>
            </div>
        </section>

        <section class="movies-section">
            <h2 class="section-title">Search Results</h2>
            <div class="movies-grid" id="moviesGrid">
                {{movie_cards | safe}}
            </div>
        </section>
    </main>

    <script>
        // Header scroll effect
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        function searchMovies() {
            const searchTerm = document.getElementById('searchInput').value;
            window.location.replace('?s='+encodeURIComponent(searchTerm))
            // Search functionality would be implemented here
        }

        function openMoviePanel() {
            // Navigate to movie panel page
            window.open('movie-panel.html', '_self');
        }

        function showMoviePanel() {
            window.open('movie-panel.html', '_self');
        }

        // Add enter key support for search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchMovies();
            }
        });

        // Enhanced card interactions
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.movie-card');
            cards.forEach(card => {
                card.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-8px) scale(1.02)';
                });
                
                card.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });
        });
    </script>
</body>
</html>
