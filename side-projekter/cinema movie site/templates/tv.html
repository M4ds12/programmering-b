<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CineHome · TV Show</title>
<style>
  :root{
    --bg:#0a0a0f; --panel:#0f0f18; --muted:#b7bad0; --text:#fff; --accent:#6d5dfc; --accent-2:#0ec7a8; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:radial-gradient(1200px 800px at 15% 0%, #151525 0%, var(--bg) 50%);color:var(--text)}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:auto;padding:24px}
  .header{display:flex;align-items:center;gap:12px;padding:16px 0}
  .back{padding:8px 12px;border:1px solid #202233;border-radius:10px;background:#0c0c14}
  .hero{display:grid;grid-template-columns:220px 1fr;gap:20px}
  .poster{border-radius:14px;overflow:hidden;border:1px solid #1a1b26}
  .poster img{display:block;width:100%;height:100%;object-fit:cover}
  .meta{background:linear-gradient(180deg,#0f0f18,transparent);border:1px solid #1a1b26;border-radius:var(--radius);padding:18px}
  .title{margin:0 0 6px;font-size:1.8rem}
  .sub{color:var(--muted);font-size:.95rem;margin-bottom:10px}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
  .badge{border:1px solid #24263a;border-radius:999px;padding:6px 10px;font-size:.78rem;color:#d5d7ea}
  .panel{margin-top:24px;background:var(--panel);border:1px solid #1a1b26;border-radius:var(--radius);padding:16px}
  details{background:#0e0e16;border:1px solid #1a1b26;border-radius:12px;margin-bottom:10px}
  summary{cursor:pointer;padding:12px 14px;font-weight:700}
  .episodes{padding:10px 12px 14px;display:grid;gap:10px}
  .ep{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:#0f0f18;border:1px solid #1a1b26;border-radius:12px;padding:8px}
  .thumb{width:72px;height:48px;border-radius:8px;background:#141424;object-fit:cover}
  .ep h4{margin:0 0 4px;font-size:1rem}
  .ep .meta{border:0;padding:0;background:none}
  .ep small{color:var(--muted)}
  .watch{padding:10px 12px;border-radius:10px;background:linear-gradient(90deg,var(--accent),#9d90ff);font-weight:700}
  .player{display:none}
  .player.active{display:block}
  .player iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
  footer{opacity:.7;color:#9aa0ba;text-align:center;padding:40px 0}
</style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <a class="back" href="search">← Back</a>
      <strong>CineHome</strong>
    </header>

    <section class="hero">
      <figure class="poster">
        <img src="{{POSTER_URL}}" alt="Show poster" />
      </figure>

      <div class="meta">
        <h1 class="title">{{TITLE}}</h1>
        <div class="sub">{{SUBTITLE}}</div>
        <div class="tags">
          <span class="badge">{{BADGE1}}</span>
          <span class="badge">{{BADGE2}}</span>
        </div>
        <p class="sub" style="margin-top:10px">
          {{OVERVIEW}}
        </p>
      </div>
    </section>

    <section class="panel player" id="player">
      <!-- The episode watch button swaps this iframe's src -->
      <iframe title="Episode player" src="" allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *; remote-playback *; presentation *" allowfullscreen x-webkit-airplay="allow"></iframe>
    </section>

    <section class="panel">
      <h2 style="margin:0 0 10px">Seasons & Episodes</h2>

      {{SEASONS | safe}}
    </section>

    <footer>© CineHome</footer>
  </div>

<script>
  // Minimal JS: clicking “Watch” swaps the iframe src and reveals the player
  document.addEventListener('click', (e) => {
    const a = e.target.closest('.watch');
    if(!a) return;
    e.preventDefault();
    //const url = a.getAttribute('data-embed');
    const player = document.getElementById('player');
    //const iframe = player.querySelector('iframe');
    //iframe.src = url || '';
    player.classList.add('active');
    player.scrollIntoView({behavior:'smooth',block:'center'});
  });
</script>
</body>
</html>
