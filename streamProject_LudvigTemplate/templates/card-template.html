<article class="card">
  <a href="{{DETAIL_URL}}" aria-label="Open {{TITLE}} details">
    <img class="poster" loading="lazy" src="{{POSTER_URL}}" alt="{{TITLE}} poster" />
  </a>
  <div class="meta">
    <div class="row">
      <span class="badge">{{TYPE_BADGE}}</span> <!-- e.g., Movie or TV -->
      <span class="rating">⭐ {{RATING}}</span> <!-- e.g., 8.3 -->
    </div>
    <h3 class="title"><a href="{{DETAIL_URL}}">{{TITLE}}</a></h3>
    <div class="row">
      <span>{{SUBLINE_LEFT}}</span>  <!-- e.g., "2024 • 1h 57m" or "2019– • 3 seasons" -->
      <span>{{SUBLINE_RIGHT}}</span> <!-- e.g., "Action, Sci-Fi" -->
    </div>
    <a class="watch" href="{{DETAIL_URL}}">Open</a>
  </div>
</article>
